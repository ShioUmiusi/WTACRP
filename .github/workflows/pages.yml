name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout terrain dataset
        uses: actions/checkout@v4
        with:
          repository: ShioUmiusi/WT-MAP-ANALYZE
          ref: data-2026.10
          path: _data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble site
        run: python tools/build_site.py --data _data --out dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
