name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python syntax
        run: python -m py_compile tools/*.py

      - name: JavaScript syntax
        run: |
          for f in mission.js scene3d3-loader.js three3d/scene.js web/wrpl-parse.js web/wrpl-worker.js; do
            node --check "$f"
          done

      - name: Demo data parses
        run: |
          python - <<'PY'
          import json
          s = open("mission-data.js", encoding="utf-8").read()
          start = s.index("window.ACE_MISSION = ") + len("window.ACE_MISSION = ")
          d = json.loads(s[start:s.rindex("}") + 1])
          assert d["meta"]["matchResults"]["players"], "no players"
          print("mission-data ok:", len(d["units"]), "units,", len(d["events"]), "events")
          PY
